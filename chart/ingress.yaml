apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniauth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: miniauth
            port:
              number: 8080
    host: miniauth.k8s.blufo.gs
