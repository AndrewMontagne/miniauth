apiVersion: v1
kind: Secret
metadata:
  name: miniauth-secret
type: Opaque
stringData:
  SHARED_SECRET: "insecure"
  URI_ROOT: "http://miniauth.k8s.blufo.gs"
  COOKIE_DOMAIN: "k8s.blufo.gs"
  EXPIRY_SECS: "2592000"
  OPENID_CONFIG_ENDPOINT: "https://idp.k8s.blufo.gs/realms/master/.well-known/openid-configuration"
  OPENID_CLIENT_ID: "kubernetes-auth"